version: 2

models:
  - name: fact_travel_hotel_booking
    description: Ce modèle centralise les données de réservation de chambres et les détails des hôtels associés.

    columns:
        - name: booking_reference
          description:  Référence unique de la réservation 
        - name: booked_at
          description:  Date de création de la réservation 
        - name: start_date
          description:  Date d'arrivée prévue 
        - name: end_date
          description:  Date de départ prévue 
        - name: booking_status
        - name: booking_price
        - name: commission_percentage 
        - name: organisation_id
        - name: organisation_name
        - name: user_id
        - name: hotel_id
        - name: hotel_name
        - name: hotel_room_id
        - name: payment_done_at
  
  - name: fact_travel_car_booking
    description: Ce modèle centralise les données de réservation de location de voitures et des compagnies de location.

    columns:
      - name: booking_reference
        description: Référence unique de la réservation.
      - name: booked_at
        description: Date à laquelle la réservation a été effectuée.
      - name: start_date
        description: Date de début de la location.
      - name: end_date
        description: Date de fin de la location.
      - name: booking_status
      - name: booking_price
      - name: commission_percentage
      - name: organisation_id
      - name: organisation_name
      - name: user_id
      - name: car_rental_company_id
      - name: car_rental_company_name
      - name: car_model_name
      - name: payment_done_at

  - name: fact_corpo_subscription_income
    description: Ce modèle calcule les revenus mensuels des abonnements d'organisations.
   
    columns:
      - name: month
        description: Mois de référence pour le calcul du revenu
        tests:
          - not_null 
      - name: organisation_id
      - name: organisation_name        
      - name: income
      - name: pricing_plan


  - name: dim_corpo_employee
    description: Ce modèle crée une dimension des employés des organisations.
    
    columns:
      - name: user_id
        description: Identifiant unique de l'utilisateur 
        tests:
          - not_null
          - unique
          
      - name: first_name
        description:  Prénom de l'utilisateur 
        tests:
          - not_null
          
      - name: last_name
        description: Nom de famille de l'utilisateur 
        tests:
          - not_null
          
      - name: email
        description: Adresse email professionnelle 
        tests:
          - not_null
          - unique
          
      - name: phone_number
        description:  Numéro de téléphone professionnel 
      - name: organisation_id
      - name: organisation_name
      - name: pricing_plan          
      - name: subscribed_at
  

  - name: fact_travel_income
    description: Ce modèle calcule les revenus journaliers générés par les réservations d'hôtels et de voitures.
    
    columns:
      - name: day
        description:  Date du paiement
        tests:
          - not_null
          
      - name: product_type
        description: Type de produit ('hotel' ou 'car') 
        tests:
          - not_null
          - accepted_values:
              values: ['hotel', 'car']
          
      - name: income          
      - name: organisation_id
      - name: organisation_name

        
  - name: fact_travel_income_monthly
    description: Ce modèle regroupe les revenus mensuels générés par les réservations d'hôtels et de voitures, ainsi que 
      les abonnements d'entreprises.
    
    columns:
      - name: month
        description:  Mois
        tests:
          - not_null
          
      - name: product_type
        description: Catégorie de revenu normalisée
        tests:
          - not_null
          - accepted_values:
              values: ['TRAVEL_CAR', 'TRAVEL_HOTEL', 'CORPO_SUBSCRIPTION']
          
      - name: income
        
        
        
        